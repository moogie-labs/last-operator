{{- if .Values.audit.bundled.enabled }}
{{- $audit := .Values.namespaces.audit }}
apiVersion: v1
kind: Service
metadata:
  name: last-rustfs
  namespace: {{ $audit }}
  labels: {{- include "last.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: last-rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: last-rustfs
  namespace: {{ $audit }}
  labels: {{- include "last.labels" . | nindent 4 }}
spec:
  serviceName: last-rustfs
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: last-rustfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: last-rustfs
        {{- include "last.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: rustfs
          image: {{ .Values.audit.bundled.image }}
          env:
            - {name: RUSTFS_VOLUMES, value: /data}
            - {name: RUSTFS_ADDRESS, value: ":9000"}
            - {name: RUSTFS_CONSOLE_ENABLE, value: "false"}
          envFrom:
            - secretRef: {name: last-audit-root}
          ports:
            - {name: s3, containerPort: 9000}
          readinessProbe:
            httpGet: {path: /health/ready, port: s3}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: s3}
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources: {{- toYaml .Values.audit.bundled.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.audit.bundled.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.audit.bundled.size }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: last-rustfs
  namespace: {{ $audit }}
  labels: {{- include "last.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: last-rustfs
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespaces.gateway }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: last-audit-init
      ports:
        - {port: 9000, protocol: TCP}
{{- end }}
