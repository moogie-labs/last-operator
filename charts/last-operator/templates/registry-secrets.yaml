{{- if .Values.registry.bundled.enabled }}
{{- $gw := .Values.namespaces.gateway }}
{{- $reg := .Values.namespaces.registry }}
{{- $pusher := include "last.persistedSecretValue" (list $gw "last-registry-pusher" "password") }}
{{- $admin := include "last.persistedSecretValue" (list $gw "last-registry-admin" "password") }}
apiVersion: v1
kind: Secret
metadata:
  name: last-registry-pusher
  namespace: {{ $gw }}
  labels: {{- include "last.labels" . | nindent 4 }}
  annotations: {helm.sh/resource-policy: keep}
type: Opaque
stringData:
  username: pusher
  password: {{ $pusher | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: last-registry-admin
  namespace: {{ $gw }}
  labels: {{- include "last.labels" . | nindent 4 }}
  annotations: {helm.sh/resource-policy: keep}
type: Opaque
stringData:
  username: admin
  password: {{ $admin | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: last-registry-auth
  namespace: {{ $reg }}
  labels: {{- include "last.labels" . | nindent 4 }}
type: Opaque
stringData:
  pusher: {{ htpasswd "pusher" $pusher | quote }}
  admin: {{ htpasswd "admin" $admin | quote }}
{{- end }}
