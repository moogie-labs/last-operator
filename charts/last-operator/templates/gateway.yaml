{{- $gw := .Values.namespaces.gateway }}
{{- $cfg := lookup "v1" "ConfigMap" $gw "last-audit-config" }}
{{- $chainId := uuidv4 }}
{{- if and $cfg $cfg.data (hasKey $cfg.data "chainId") }}{{ $chainId = index $cfg.data "chainId" }}{{ end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: last-audit-config
  namespace: {{ $gw }}
  labels: {{- include "last.labels" . | nindent 4 }}
  annotations:
    # The chain ID must never change for an existing audit bucket.
    helm.sh/resource-policy: keep
data:
  chainId: {{ $chainId | quote }}
  bucket: {{ .Values.audit.bucket | quote }}
  endpoint: {{ include "last.auditEndpoint" . | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: last-gateway
  namespace: {{ $gw }}
  labels: {{- include "last.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: last-gateway
  namespace: {{ $gw }}
  labels: {{- include "last.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets, configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [last-audit-signing]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [last-audit-pubkey]
    verbs: [get, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [last-gateway-audit-writer]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: last-gateway
  namespace: {{ $gw }}
  labels: {{- include "last.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: last-gateway
subjects:
  - kind: ServiceAccount
    name: last-gateway
    namespace: {{ $gw }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: last-gateway
  namespace: {{ $gw }}
  labels: {{- include "last.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: last-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: last-gateway
        {{- include "last.labels" . | nindent 8 }}
    spec:
      serviceAccountName: last-gateway
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gateway
          image: {{ include "last.image" (list . "gateway") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: LAST_AUDIT_ENDPOINT, value: {{ include "last.auditEndpoint" . | quote }}}
            - {name: LAST_AUDIT_REGION, value: {{ .Values.audit.external.region | quote }}}
            - {name: LAST_AUDIT_PATH_STYLE, value: {{ ternary "true" (toString .Values.audit.external.pathStyle) .Values.audit.bundled.enabled | quote }}}
            - {name: LAST_AUDIT_BUCKET, value: {{ .Values.audit.bucket | quote }}}
            - {name: LAST_AUDIT_RETENTION, value: {{ printf "%dh" (mul .Values.audit.retentionDays 24) | quote }}}
            - name: LAST_AUDIT_CHAIN_ID
              valueFrom: {configMapKeyRef: {name: last-audit-config, key: chainId}}
            - name: LAST_AUDIT_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: {{ include "last.writerSecret" . }}, key: accessKey}}
            - name: LAST_AUDIT_SECRET_KEY
              valueFrom: {secretKeyRef: {name: {{ include "last.writerSecret" . }}, key: secretKey}}
            - {name: LAST_GRPC_ADDR, value: ":9090"}
            - {name: LAST_OPERATOR_IDENTITY, value: {{ printf "system:serviceaccount:%s:last-operator" .Release.Namespace | quote }}}
          ports:
            - {name: http, containerPort: 8080}
            - {name: grpc, containerPort: 9090}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: last-gateway
  namespace: {{ $gw }}
  labels: {{- include "last.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: last-gateway
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: grpc, port: 9090, targetPort: grpc}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: last-gateway
  namespace: {{ .Values.namespaces.gateway }}
  labels: {{- include "last.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: last-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
      ports:
        - {port: 9090, protocol: TCP}
    - ports:
        - {port: 8080, protocol: TCP}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: last-gateway-tokenreview
  labels: {{- include "last.labels" . | nindent 4 }}
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: last-gateway-tokenreview
  labels: {{- include "last.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: last-gateway-tokenreview
subjects:
  - kind: ServiceAccount
    name: last-gateway
    namespace: {{ .Values.namespaces.gateway }}
