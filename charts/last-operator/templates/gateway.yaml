{{- $gw := .Values.namespaces.gateway }}
{{- $cfg := lookup "v1" "ConfigMap" $gw "last-audit-config" }}
{{- $chainId := uuidv4 }}
{{- if and $cfg $cfg.data (hasKey $cfg.data "chainId") }}{{ $chainId = index $cfg.data "chainId" }}{{ end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: last-audit-config
  namespace: {{ $gw }}
  labels: {{- include "last.labels" . | nindent 4 }}
  annotations:
    # The chain ID must never change for an existing audit bucket.
    helm.sh/resource-policy: keep
data:
  chainId: {{ $chainId | quote }}
  bucket: {{ .Values.audit.bucket | quote }}
  endpoint: {{ include "last.auditEndpoint" . | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: last-gateway
  namespace: {{ $gw }}
  labels: {{- include "last.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: last-gateway
  namespace: {{ $gw }}
  labels: {{- include "last.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, delete]   # signing key, provider credentials, per-run token anchors
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, create, update, delete]   # public key, LLM scripts, gateway-owned intent records (delete: a finished Intent's record)
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    verbs: [create]                      # kubernetes Provider tokens, bound to the run anchor
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [last-gateway-audit-writer]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: last-gateway
  namespace: {{ $gw }}
  labels: {{- include "last.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: last-gateway
subjects:
  - kind: ServiceAccount
    name: last-gateway
    namespace: {{ $gw }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: last-gateway-sandbox
  namespace: {{ .Values.namespaces.sandbox }}
  labels: {{- include "last.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, list, delete]   # get: compare the last-registry-pull copy (external registry)
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: last-gateway-sandbox
  namespace: {{ .Values.namespaces.sandbox }}
  labels: {{- include "last.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: last-gateway-sandbox}
subjects:
  - {kind: ServiceAccount, name: last-gateway, namespace: {{ $gw }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: last-gateway-apiserver
  namespace: default
  labels: {{- include "last.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [services]
    resourceNames: [kubernetes]
    verbs: [get]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: last-gateway-apiserver
  namespace: default
  labels: {{- include "last.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: last-gateway-apiserver}
subjects:
  - {kind: ServiceAccount, name: last-gateway, namespace: {{ $gw }}}
{{- if .Values.registry.bundled.enabled }}
---
# The gateway reads the front Service and lists its EndpointSlices to build the egress rules
# for image builds.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: last-gateway-registry
  namespace: {{ .Values.namespaces.registry }}
  labels: {{- include "last.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [services]
    verbs: [get]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: last-gateway-registry
  namespace: {{ .Values.namespaces.registry }}
  labels: {{- include "last.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: last-gateway-registry}
subjects:
  - {kind: ServiceAccount, name: last-gateway, namespace: {{ $gw }}}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: last-gateway-lifecycle
  labels: {{- include "last.labels" . | nindent 4 }}
rules:
  - apiGroups: [last.moogie-labs.com]
    resources: [intents, intentapprovals, managedresources, intentpolicies, operatorconfigs, providers, llmproviders, commandrules, clustercommandrules]
    verbs: [get, list, watch]
  - apiGroups: [last.moogie-labs.com]
    resources: [commandrulesuggestions]
    verbs: [get, list, watch]            # read-only: the denial decisions it keeps (M7 S3)
  - apiGroups: [last.moogie-labs.com]
    resources: [managedresources]
    verbs: [delete]                      # the ManagedResources a succeeded Update dropped, each audited (spec §15)
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update]         # output Secrets in Intent namespaces (spec §15)
  - apiGroups: [""]
    resources: [services]
    verbs: [get]                         # service egress canaries
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list]                        # the node egress canary
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: last-gateway-lifecycle
  labels: {{- include "last.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: last-gateway-lifecycle}
subjects:
  - {kind: ServiceAccount, name: last-gateway, namespace: {{ $gw }}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: last-gateway
  namespace: {{ $gw }}
  labels: {{- include "last.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: last-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: last-gateway
        {{- include "last.labels" . | nindent 8 }}
    spec:
      serviceAccountName: last-gateway
      terminationGracePeriodSeconds: {{ add .Values.gateway.drainTimeoutSeconds 30 }} # drain timeout plus 30s
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gateway
          image: {{ include "last.image" (list . "gateway") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: LAST_AUDIT_ENDPOINT, value: {{ include "last.auditEndpoint" . | quote }}}
            - {name: LAST_AUDIT_REGION, value: {{ .Values.audit.external.region | quote }}}
            - {name: LAST_AUDIT_PATH_STYLE, value: {{ ternary "true" (toString .Values.audit.external.pathStyle) .Values.audit.bundled.enabled | quote }}}
            - {name: LAST_AUDIT_BUCKET, value: {{ .Values.audit.bucket | quote }}}
            - {name: LAST_AUDIT_RETENTION, value: {{ printf "%dh" (mul .Values.audit.retentionDays 24) | quote }}}
            - name: LAST_AUDIT_CHAIN_ID
              valueFrom: {configMapKeyRef: {name: last-audit-config, key: chainId}}
            - name: LAST_AUDIT_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: {{ include "last.writerSecret" . }}, key: accessKey}}
            - name: LAST_AUDIT_SECRET_KEY
              valueFrom: {secretKeyRef: {name: {{ include "last.writerSecret" . }}, key: secretKey}}
            - {name: LAST_AUDIT_WRITER_SECRET, value: {{ include "last.writerSecret" . | quote }}}
            - {name: LAST_GRPC_ADDR, value: ":9090"}
            - {name: LAST_OPERATOR_IDENTITY, value: {{ printf "system:serviceaccount:%s:last-operator" .Release.Namespace | quote }}}
            - {name: LAST_SANDBOX_NAMESPACE, value: {{ .Values.namespaces.sandbox | quote }}}
            - {name: LAST_EGRESS_CANARIES, value: {{ .Values.sandbox.egressCanaries | default (printf "service/%s/last-gateway:8080,node:10250" $gw) | quote }}}
            - {name: LAST_DRAIN_TIMEOUT, value: {{ printf "%ds" (int .Values.gateway.drainTimeoutSeconds) | quote }}}
            - {name: LAST_REGISTRY_FRONT_HOST, value: {{ printf "last-registry-front.%s.svc:5000" .Values.namespaces.registry | quote }}}
            - {name: LAST_REGISTRY_PULL_HOST, value: {{ printf "localhost:%d" (int .Values.registry.bundled.hostPort) | quote }}}
            - {name: LAST_REGISTRY_NAMESPACE, value: {{ .Values.namespaces.registry | quote }}}
            - {name: LAST_IMAGE_GC_INTERVAL, value: {{ .Values.gateway.imageGCInterval | quote }}}
            {{- if .Values.registry.bundled.enabled }}
            - {name: LAST_REGISTRY_GC_URL, value: {{ printf "http://last-registry-gc.%s.svc:5001" .Values.namespaces.registry | quote }}}
            {{- end }}
            - {name: LAST_BUILD_NAMESPACE, value: {{ .Values.namespaces.build | quote }}}
            - {name: LAST_BUILDKIT_IMAGE, value: {{ .Values.registry.bundled.buildkitImage | quote }}}
            {{- with .Values.sandbox.image }}
            - {name: LAST_SANDBOX_IMAGE, value: {{ . | quote }}}
            {{- end }}
          ports:
            - {name: http, containerPort: 8080}
            - {name: grpc, containerPort: 9090}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: last-gateway
  namespace: {{ $gw }}
  labels: {{- include "last.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: last-gateway
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: grpc, port: 9090, targetPort: grpc}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: last-gateway
  namespace: {{ .Values.namespaces.gateway }}
  labels: {{- include "last.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: last-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: last-operator
      ports:
        - {port: 9090, protocol: TCP}
    # This rule must stay open from anywhere (no from:): the sandbox egress gate uses
    # this port as a canary that must be reachable from outside last-sandbox when
    # egress is open. helm-lint checks it.
    - ports:
        - {port: 8080, protocol: TCP}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: last-gateway-tokenreview
  labels: {{- include "last.labels" . | nindent 4 }}
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: last-gateway-tokenreview
  labels: {{- include "last.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: last-gateway-tokenreview
subjects:
  - kind: ServiceAccount
    name: last-gateway
    namespace: {{ .Values.namespaces.gateway }}
