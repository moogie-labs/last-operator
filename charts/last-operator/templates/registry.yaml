{{- define "last.registry.frontConf" -}}
# GET/HEAD anonymous; DELETE admin only; every other method pusher only.
map $request_method $realm { GET off; HEAD off; default "last-registry"; }
map $request_method $users { DELETE /etc/nginx/auth/admin; default /etc/nginx/auth/pusher; }
server {
  listen 5000;
  client_max_body_size 0;
  location /v2/ {
    auth_basic $realm;
    auth_basic_user_file $users;
    proxy_pass http://last-registry.{{ .Values.namespaces.registry }}.svc:5000;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 900;
    proxy_request_buffering off;
  }
}
{{- end }}
{{- define "last.registry.pullConf" -}}
# Kubelet needs /v2/ plus manifests and blobs by digest, over GET and HEAD
# (limit_except GET also allows HEAD). Tag lists, _catalog, other
# repositories, tags and every write method get 403.
server {
  listen 5000;
  location = /healthz { access_log off; return 200; }
  location = /v2/ {
    limit_except GET { deny all; }
    proxy_pass http://last-registry-front.{{ .Values.namespaces.registry }}.svc:5000;
    proxy_set_header Host $http_host;
  }
  # Quoted, because nginx ends a token at a brace. \z, not $, which also matches before a trailing newline.
  # No URI part on proxy_pass, so the original URI passes through.
  location ~ "^/v2/last/(images|base)/(manifests|blobs)/sha256:[0-9a-f]{64}\z" {
    limit_except GET { deny all; }
    proxy_pass http://last-registry-front.{{ .Values.namespaces.registry }}.svc:5000;
    proxy_set_header Host $http_host;
    proxy_buffering off;
  }
  location / { return 403; }
}
{{- end }}
{{- if .Values.registry.bundled.enabled }}
{{- $reg := .Values.namespaces.registry }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: last-registry-data
  namespace: {{ $reg }}
  labels: {{- include "last.labels" . | nindent 4 }}
  annotations: {helm.sh/resource-policy: keep}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.registry.bundled.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.registry.bundled.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: last-registry
  namespace: {{ $reg }}
  labels: {{- include "last.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: last-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: last-registry
        {{- include "last.labels" . | nindent 8 }}
    spec:
      # The GC sidecar waits up to 25 minutes for an in-flight garbage collection on SIGTERM;
      # the grace period is that plus 60 s so a rollout does not kill a run midway.
      terminationGracePeriodSeconds: 1560
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: registry
          image: {{ .Values.registry.bundled.image }}
          env:
            - {name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true"}
            - {name: OTEL_TRACES_EXPORTER, value: none}
          ports:
            - {name: registry, containerPort: 5000}
          readinessProbe:
            httpGet: {path: /v2/, port: registry}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /v2/, port: registry}
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources: {{- toYaml .Values.registry.bundled.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/registry}
        - name: registry-gc
          image: {{ tpl .Values.registry.bundled.gcImage . }}
          env:
            # Same overrides as the registry container: `registry garbage-collect` reads the same config.
            - {name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true"}
            - {name: OTEL_TRACES_EXPORTER, value: none}
          ports:
            - {name: gc, containerPort: 5001}
          readinessProbe:
            tcpSocket: {port: gc}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: gc}
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources: {{- toYaml .Values.registry.bundled.gcResources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/registry}
            - {name: gc-auth, mountPath: /etc/registry-gc, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: last-registry-data}
        # Only the admin line, as a directory mount (no subPath) so kubelet refreshes it when the Secret changes
        # and the registry pod never restarts for it. The sidecar never sees the pusher's line.
        - name: gc-auth
          secret:
            secretName: last-registry-auth
            items:
              - {key: admin, path: htpasswd}
---
apiVersion: v1
kind: Service
metadata:
  name: last-registry
  namespace: {{ $reg }}
  labels: {{- include "last.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: last-registry
  ports:
    - name: registry
      port: 5000
      targetPort: registry
---
apiVersion: v1
kind: Service
metadata:
  name: last-registry-gc
  namespace: {{ $reg }}
  labels: {{- include "last.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: last-registry
  ports:
    - name: gc
      port: 5001
      targetPort: gc
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: last-registry-front
  namespace: {{ $reg }}
  labels: {{- include "last.labels" . | nindent 4 }}
data:
  default.conf: |
    {{- include "last.registry.frontConf" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: last-registry-front
  namespace: {{ $reg }}
  labels: {{- include "last.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: last-registry-front
  template:
    metadata:
      labels:
        app.kubernetes.io/name: last-registry-front
        {{- include "last.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include "last.registry.frontConf" . | sha256sum }}
        checksum/auth: {{ include (print $.Template.BasePath "/registry-secrets.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nginx
          image: {{ .Values.registry.bundled.proxyImage }}
          ports:
            - {name: registry, containerPort: 5000}
          readinessProbe:
            httpGet: {path: /v2/, port: registry}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources: {{- toYaml .Values.registry.bundled.frontResources | nindent 12 }}
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
            - {name: auth, mountPath: /etc/nginx/auth, readOnly: true}
      volumes:
        - name: conf
          configMap: {name: last-registry-front}
        - name: auth
          secret: {secretName: last-registry-auth}
---
apiVersion: v1
kind: Service
metadata:
  name: last-registry-front
  namespace: {{ $reg }}
  labels: {{- include "last.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: last-registry-front
  ports:
    - name: registry
      port: 5000
      targetPort: registry
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: last-registry
  namespace: {{ $reg }}
  labels: {{- include "last.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: last-registry
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: last-registry-front
      ports:
        - {port: 5000, protocol: TCP}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespaces.gateway }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: last-gateway
      ports:
        - {port: 5001, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: last-registry-front
  namespace: {{ $reg }}
  labels: {{- include "last.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: last-registry-front
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: last-registry-pull-proxy
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespaces.build }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespaces.gateway }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: last-gateway
      ports:
        - {port: 5000, protocol: TCP}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: last-registry-pull-proxy
  namespace: {{ $reg }}
  labels: {{- include "last.labels" . | nindent 4 }}
data:
  default.conf: |
    {{- include "last.registry.pullConf" . | nindent 4 }}
---
# No NetworkPolicy: kubelet reaches this pod from the node through the hostPort
# DNAT, and how CNIs treat that traffic differs. The allowlist above is the control.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: last-registry-pull-proxy
  namespace: {{ $reg }}
  labels: {{- include "last.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: last-registry-pull-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: last-registry-pull-proxy
        {{- include "last.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include "last.registry.pullConf" . | sha256sum }}
    spec:
      tolerations:
        - operator: Exists
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nginx
          image: {{ .Values.registry.bundled.proxyImage }}
          ports:
            - {name: registry, containerPort: 5000, hostPort: {{ .Values.registry.bundled.hostPort }}}
          readinessProbe:
            httpGet: {path: /healthz, port: registry}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: registry}
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources: {{- toYaml .Values.registry.bundled.pullProxyResources | nindent 12 }}
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
      volumes:
        - name: conf
          configMap: {name: last-registry-pull-proxy}
{{- end }}
