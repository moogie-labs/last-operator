---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: llmproviders.last.moogie-labs.com
spec:
  group: last.moogie-labs.com
  names:
    kind: LLMProvider
    listKind: LLMProviderList
    plural: llmproviders
    singular: llmprovider
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.model
      name: Model
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LLMProvider is a model endpoint the gateway can call.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: LLMProviderSpec configures one model endpoint.
            properties:
              effort:
                description: |-
                  Effort is the model's reasoning effort, for adapters that support it
                  (anthropic). Empty means high: planning is intelligence-sensitive.
                enum:
                - low
                - medium
                - high
                - xhigh
                - max
                type: string
              endpoint:
                description: 'Endpoint is the API base URL: required for openai-compatible;
                  optional for openai and anthropic (a proxy).'
                type: string
              model:
                minLength: 1
                type: string
              scripted:
                description: |-
                  ScriptedLLM points at a ConfigMap in last-gateway. Each key is an Intent
                  ("<namespace>.<name>") and each value a JSON array of response strings; the
                  n-th response answers a conversation that already holds n assistant messages.
                properties:
                  configMapRef:
                    description: LocalRef names an object in the same namespace (or
                      a cluster-scoped object).
                    properties:
                      name:
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                required:
                - configMapRef
                type: object
              secretRef:
                description: SecretRef names a Secret in last-gateway holding the
                  API key under the key "apiKey".
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              type:
                description: LLMProviderType selects a gateway LLM adapter.
                enum:
                - anthropic
                - openai
                - openai-compatible
                - scripted
                type: string
            required:
            - model
            - type
            type: object
            x-kubernetes-validations:
            - message: endpoint is required for openai-compatible
              rule: self.type != 'openai-compatible' || has(self.endpoint)
            - message: secretRef is required unless type is scripted
              rule: self.type == 'scripted' || has(self.secretRef)
            - message: scripted is required when type is scripted
              rule: self.type != 'scripted' || has(self.scripted)
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
