# The operator's cluster-wide permissions (spec §4.1). The operator is
# untrusted: it reads approvals, policy, configuration and Providers, and writes only
# Intent status, the Intent's teardown finalizer (patch) and ManagedResources. It
# deletes an Intent's ManagedResources once their teardown succeeded, which
# garbage-collects their output Secrets (M5 design §3.4). It has no access to
# Secrets, Pods, ConfigMaps or anything in the gateway, sandbox or audit
# namespaces, and cannot impersonate or mint tokens. test/admission checks this file.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: last-operator
rules:
  - apiGroups: [last.moogie-labs.com]
    resources: [intents]
    verbs: [get, list, watch, patch]
  - apiGroups: [last.moogie-labs.com]
    resources: [intents/status]
    verbs: [get, update, patch]
  - apiGroups: [last.moogie-labs.com]
    resources: [intents/finalizers]
    verbs: [update]
  - apiGroups: [last.moogie-labs.com]
    resources: [managedresources]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [last.moogie-labs.com]
    resources: [managedresources/status]
    verbs: [get, update, patch]
  - apiGroups: [last.moogie-labs.com]
    resources: [intentapprovals, intentpolicies, operatorconfigs, providers]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create, patch]
