# The operator's cluster-wide permissions (spec §4.1). The operator is
# untrusted: it reads approvals, policy, configuration and Providers, and writes only
# Intent status, ManagedResources and the Intent's teardown finalizer (patch on
# intents, which files/intent-operator-policy.yaml limits to that one finalizer). An
# Intent's ManagedResources go by ownerReference garbage collection once the
# finalizer is released after a succeeded Delete phase. It has no access to Secrets, Pods,
# ConfigMaps or anything in the gateway, sandbox or audit namespaces, cannot
# impersonate or mint tokens, and cannot delete ManagedResources (that would
# garbage-collect output Secrets unaudited). test/admission checks this file.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: last-operator
rules:
  - apiGroups: [last.moogie-labs.com]
    resources: [intents]
    verbs: [get, list, watch, patch]
  - apiGroups: [last.moogie-labs.com]
    resources: [intents/status]
    verbs: [get, update, patch]
  - apiGroups: [last.moogie-labs.com]
    resources: [intents/finalizers]
    verbs: [update]
  - apiGroups: [last.moogie-labs.com]
    resources: [managedresources]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [last.moogie-labs.com]
    resources: [managedresources/status]
    verbs: [get, update, patch]
  - apiGroups: [last.moogie-labs.com]
    resources: [intentapprovals, intentpolicies, operatorconfigs, providers]
    verbs: [get, list, watch]
  - apiGroups: [last.moogie-labs.com]
    resources: [commandrules, clustercommandrules]
    verbs: [get, list, watch]            # read-only: admission (files/rules-policy.yaml) refuses its writes too
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create, patch]
