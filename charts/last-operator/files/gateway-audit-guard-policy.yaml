apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: last-gateway-audit-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE", "DELETE"]
        resources: ["secrets", "configmaps"]
  matchConditions:
    - name: gateway-service-account
      expression: "request.userInfo.username.startsWith('system:serviceaccount:') && request.userInfo.username.endsWith(':last-gateway')"
  validations:
    - expression: "!(request.resource.resource == 'secrets' && request.name in ['last-audit-signing', 'last-audit-writer']) && !(request.resource.resource == 'configmaps' && request.name == 'last-audit-config')"
      message: "the gateway may not change or delete its audit signing key, writer credentials, or chain config"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: last-gateway-audit-guard
spec:
  policyName: last-gateway-audit-guard
  validationActions: [Deny]
