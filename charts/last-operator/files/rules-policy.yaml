# Allow rules let a command run without approval, so only a human may write them
# (spec §4.1, §9). The operator and the gateway only read CommandRules and
# ClusterCommandRules. This policy refuses their writes even if RBAC were widened.
# This file is static, so it names the default gateway namespace, last-gateway, as
# intentapproval-policy.yaml does.
# DELETE is deliberately not matched: deleting a rule only narrows what runs
# without approval, so it needs no guard beyond RBAC.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: last-rules
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["last.moogie-labs.com"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["commandrules", "clustercommandrules"]
  validations:
    - expression: "!(request.userInfo.username.startsWith('system:serviceaccount:') && request.userInfo.username.endsWith(':last-operator'))"
      message: "the operator may not write allow rules"
    - expression: "!request.userInfo.username.startsWith('system:serviceaccount:last-gateway:')"
      message: "ServiceAccounts in the gateway namespace may not write allow rules"
    # Provenance (M7 S4): the CLI records who created a rule, and the record is the requester.
    # A hand-written rule may leave source out.
    - expression: "request.operation != 'CREATE' || !has(object.spec.source) || (has(object.spec.source.createdBy) && object.spec.source.createdBy == request.userInfo.username)"
      message: "spec.source.createdBy must be the requesting user"
    - expression: "request.operation != 'UPDATE' || (has(object.spec.source) ? (has(oldObject.spec.source) && object.spec.source == oldObject.spec.source) : !has(oldObject.spec.source))"
      message: "spec.source cannot be changed"
    - expression: "!has(object.spec.source) || object.spec.source.createdFrom != 'suggestion' || has(object.spec.source.suggestionRef)"
      message: "spec.source.suggestionRef is required when createdFrom is suggestion"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: last-rules
spec:
  policyName: last-rules
  validationActions: [Deny]
