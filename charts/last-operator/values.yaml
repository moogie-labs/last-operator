image:
  registry: ghcr.io/moogie-labs
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

namespaces:
  create: true          # set false to pre-create namespaces yourself (see audit.external.existingSecret)
  gateway: last-gateway
  audit: last-audit
  sandbox: last-sandbox

audit:
  bucket: last-audit
  retentionDays: 365
  bundled:
    enabled: true
    image: rustfs/rustfs:1.0.0
    storageClassName: ""   # "" = cluster default
    size: 10Gi
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {memory: 2Gi}
  external:
    endpoint: ""
    region: us-east-1
    pathStyle: false
    existingSecret: ""     # Secret in the gateway namespace with keys accessKey, secretKey.
                            # Since the chart normally owns and can delete that namespace,
                            # external mode typically pairs with namespaces.create=false,
                            # with the gateway namespace (and this Secret in it) pre-created.

gateway:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
