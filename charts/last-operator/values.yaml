image:
  registry: ghcr.io/moogie-labs
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

namespaces:
  create: true          # set false to pre-create the namespaces yourself: gateway, sandbox and build always,
                        # audit with the bundled store (see audit.external.existingSecret), registry with
                        # registry.bundled.enabled. The registry namespace (hostPort DaemonSet) and the build
                        # namespace need the label pod-security.kubernetes.io/enforce=privileged.
  gateway: last-gateway
  audit: last-audit
  sandbox: last-sandbox
  registry: last-registry
  build: last-build

audit:
  bucket: last-audit
  retentionDays: 365
  bundled:
    enabled: true
    image: rustfs/rustfs:1.0.0
    storageClassName: ""   # "" = cluster default
    size: 10Gi
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {memory: 2Gi}
  external:
    endpoint: ""
    region: us-east-1
    pathStyle: false
    existingSecret: ""     # Secret in the gateway namespace with keys accessKey, secretKey.
                            # Since the chart normally owns and can delete that namespace,
                            # external mode typically pairs with namespaces.create=false,
                            # with the gateway namespace (and this Secret in it) pre-created.

registry:
  bundled:
    enabled: true
    image: registry:3.0.0
    proxyImage: nginxinc/nginx-unprivileged:1.27.5-alpine
    storageClassName: ""   # "" = cluster default
    size: 20Gi
    hostPort: 5000
    buildkitImage: moby/buildkit:v0.26.2-rootless   # image builds; preload it on air-gapped nodes
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {memory: 512Mi}
    frontResources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 128Mi}
    gcImage: '{{ include "last.image" (list . "registry-gc") }}'   # the GC sidecar; rendered with tpl
    gcResources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 256Mi}
    pullProxyResources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {memory: 64Mi}

gateway:
  imageGCInterval: 24h   # how often the gateway garbage-collects unused images; the first run is one interval after it takes leadership
  drainTimeoutSeconds: 300   # in-flight RPC drain on shutdown; the pod grace period is this plus 30
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}

operator:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}

sandbox:
  # Fallback sandbox image, used only while OperatorConfig spec.sandbox.baseImage is
  # unset (development and e2e). Production pins the image by digest in OperatorConfig.
  image: ""
  # Comma-separated egress canaries (spec §11.1): IP:port, service/<ns>/<name>:<port>,
  # or node:<port>. Empty means the gateway Service's http port and a node's kubelet.
  egressCanaries: ""
