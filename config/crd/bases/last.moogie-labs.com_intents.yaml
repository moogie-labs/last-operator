---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: intents.last.moogie-labs.com
spec:
  group: last.moogie-labs.com
  names:
    kind: Intent
    listKind: IntentList
    plural: intents
    singular: intent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.stage
      name: Stage
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Intent is a natural-language provisioning request.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: IntentSpec is a natural-language request plus the requester's
              inputs.
            properties:
              answers:
                items:
                  description: Answer answers one of status.questions.
                  properties:
                    id:
                      minLength: 1
                      type: string
                    value:
                      type: string
                  required:
                  - id
                  - value
                  type: object
                type: array
              modes:
                description: Modes may only be as strict as, or stricter than, the
                  effective policy.
                properties:
                  create:
                    description: Mode selects whether a lifecycle stage needs human
                      approval.
                    enum:
                    - Auto
                    - Manual
                    type: string
                  delete:
                    description: Mode selects whether a lifecycle stage needs human
                      approval.
                    enum:
                    - Auto
                    - Manual
                    type: string
                  discovery:
                    description: Mode selects whether a lifecycle stage needs human
                      approval.
                    enum:
                    - Auto
                    - Manual
                    type: string
                  reconcile:
                    description: Mode selects whether a lifecycle stage needs human
                      approval.
                    enum:
                    - Auto
                    - Manual
                    type: string
                type: object
              request:
                minLength: 1
                type: string
            required:
            - request
            type: object
          status:
            description: IntentStatus is written by the operator.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              effectiveModes:
                description: |-
                  EffectiveModes is the Auto or Manual mode each stage key resolved to across
                  the policy layers and spec.modes.
                properties:
                  create:
                    description: Mode selects whether a lifecycle stage needs human
                      approval.
                    enum:
                    - Auto
                    - Manual
                    type: string
                  delete:
                    description: Mode selects whether a lifecycle stage needs human
                      approval.
                    enum:
                    - Auto
                    - Manual
                    type: string
                  discovery:
                    description: Mode selects whether a lifecycle stage needs human
                      approval.
                    enum:
                    - Auto
                    - Manual
                    type: string
                  reconcile:
                    description: Mode selects whether a lifecycle stage needs human
                      approval.
                    enum:
                    - Auto
                    - Manual
                    type: string
                type: object
              observedGeneration:
                format: int64
                type: integer
              observedRequestHash:
                description: |-
                  ObservedRequestHash is the SHA-256 of spec.request for the current planning
                  session; answers to clarifying questions do not start a new session.
                type: string
              observedRetry:
                description: |-
                  ObservedRetry is the last.moogie-labs.com/retry annotation's value when the
                  current planning session started; a different value retries a Failed Intent.
                type: string
              pendingCommand:
                description: PendingCommand is a discovery command awaiting approval.
                properties:
                  command:
                    description: 'Command is the unit of action: one sandboxed execution
                      (spec §8.1).'
                    properties:
                      egress:
                        description: Egress lists host:port or CIDR:port destinations
                          beyond what providers imply.
                        items:
                          type: string
                        type: array
                      files:
                        additionalProperties:
                          type: string
                        description: Files are written under /work before the command
                          runs, keyed by absolute path.
                        type: object
                      id:
                        type: string
                      image:
                        description: ImageSpec lists install commands baked into the
                          command's image at build time (spec §11.2).
                        properties:
                          install:
                            items:
                              description: ArgvCommand is a command executed directly,
                                without a shell.
                              properties:
                                argv:
                                  items:
                                    type: string
                                  minItems: 1
                                  type: array
                              required:
                              - argv
                              type: object
                            minItems: 1
                            type: array
                        required:
                        - install
                        type: object
                      providers:
                        description: Providers names the Provider credentials to inject.
                        items:
                          type: string
                        type: array
                      reason:
                        type: string
                      run:
                        description: CommandRun is exactly one of argv (exec'd directly)
                          or script (run with /bin/sh -c).
                        properties:
                          argv:
                            items:
                              type: string
                            minItems: 1
                            type: array
                          script:
                            minLength: 1
                            type: string
                        type: object
                        x-kubernetes-validations:
                        - message: exactly one of argv or script must be set
                          rule: has(self.argv) != has(self.script)
                      timeout:
                        type: string
                    required:
                    - run
                    type: object
                  generalization:
                    description: Generalization is an LLM-proposed wildcard pattern
                      for an allow rule (advice only).
                    properties:
                      argv:
                        items:
                          type: string
                        type: array
                      lint:
                        items:
                          type: string
                        type: array
                    required:
                    - argv
                    type: object
                  hash:
                    type: string
                  nonce:
                    description: |-
                      Nonce makes this request its own approval subject: Hash is the SHA-256 of
                      the canonical JSON of {command, nonce}, so an approval is single-use.
                    type: string
                  reason:
                    type: string
                required:
                - command
                - hash
                type: object
              phase:
                description: Phase is where an Intent is in its lifecycle (spec §7).
                enum:
                - Pending
                - Clarifying
                - Planning
                - AwaitingDiscoveryApproval
                - AwaitingApproval
                - Executing
                - Verifying
                - Ready
                - Drifted
                - Remediating
                - TearingDown
                - Failed
                type: string
              plan:
                description: Plan is the agent's reviewable plan (spec §8.2).
                properties:
                  generalizations:
                    additionalProperties:
                      description: Generalization is an LLM-proposed wildcard pattern
                        for an allow rule (advice only).
                      properties:
                        argv:
                          items:
                            type: string
                          type: array
                        lint:
                          items:
                            type: string
                          type: array
                      required:
                      - argv
                      type: object
                    type: object
                  hash:
                    type: string
                  nonce:
                    description: |-
                      Nonce makes a Remediate plan its own approval subject: it is part of the
                      hashed body, so the same repair for a recurring drift needs a new
                      approval. Only Remediate plans carry one (32 lowercase hex characters).
                    type: string
                  resources:
                    items:
                      description: |-
                        ManagedResourceSpec describes one provisioned thing. It is also used as a
                        template inside Plan.resources, where IntentRef is omitted.
                      properties:
                        description:
                          type: string
                        desired:
                          description: Desired is the approved desired-state snapshot.
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        identity:
                          description: 'Identity is free-form: how humans and the
                            agent find this thing again.'
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        intentRef:
                          description: LocalRef names an object in the same namespace
                            (or a cluster-scoped object).
                          properties:
                            name:
                              minLength: 1
                              type: string
                          required:
                          - name
                          type: object
                        outputs:
                          additionalProperties:
                            type: string
                          description: |-
                            Outputs maps output Secret keys to step references such as
                            "${steps.s1.json.password}". The gateway writes exactly these values to
                            outputsSecretRef (spec §15).
                          type: object
                        outputsSecretRef:
                          description: LocalRef names an object in the same namespace
                            (or a cluster-scoped object).
                          properties:
                            name:
                              minLength: 1
                              type: string
                          required:
                          - name
                          type: object
                        probes:
                          items:
                            description: Probe is a command plus a CEL assertion over
                              its result (spec §10).
                            properties:
                              assert:
                                minLength: 1
                                type: string
                              command:
                                description: 'Command is the unit of action: one sandboxed
                                  execution (spec §8.1).'
                                properties:
                                  egress:
                                    description: Egress lists host:port or CIDR:port
                                      destinations beyond what providers imply.
                                    items:
                                      type: string
                                    type: array
                                  files:
                                    additionalProperties:
                                      type: string
                                    description: Files are written under /work before
                                      the command runs, keyed by absolute path.
                                    type: object
                                  id:
                                    type: string
                                  image:
                                    description: ImageSpec lists install commands
                                      baked into the command's image at build time
                                      (spec §11.2).
                                    properties:
                                      install:
                                        items:
                                          description: ArgvCommand is a command executed
                                            directly, without a shell.
                                          properties:
                                            argv:
                                              items:
                                                type: string
                                              minItems: 1
                                              type: array
                                          required:
                                          - argv
                                          type: object
                                        minItems: 1
                                        type: array
                                    required:
                                    - install
                                    type: object
                                  providers:
                                    description: Providers names the Provider credentials
                                      to inject.
                                    items:
                                      type: string
                                    type: array
                                  reason:
                                    type: string
                                  run:
                                    description: CommandRun is exactly one of argv
                                      (exec'd directly) or script (run with /bin/sh
                                      -c).
                                    properties:
                                      argv:
                                        items:
                                          type: string
                                        minItems: 1
                                        type: array
                                      script:
                                        minLength: 1
                                        type: string
                                    type: object
                                    x-kubernetes-validations:
                                    - message: exactly one of argv or script must
                                        be set
                                      rule: has(self.argv) != has(self.script)
                                  timeout:
                                    type: string
                                required:
                                - run
                                type: object
                              id:
                                minLength: 1
                                type: string
                            required:
                            - assert
                            - command
                            - id
                            type: object
                          type: array
                        teardown:
                          items:
                            description: 'Command is the unit of action: one sandboxed
                              execution (spec §8.1).'
                            properties:
                              egress:
                                description: Egress lists host:port or CIDR:port destinations
                                  beyond what providers imply.
                                items:
                                  type: string
                                type: array
                              files:
                                additionalProperties:
                                  type: string
                                description: Files are written under /work before
                                  the command runs, keyed by absolute path.
                                type: object
                              id:
                                type: string
                              image:
                                description: ImageSpec lists install commands baked
                                  into the command's image at build time (spec §11.2).
                                properties:
                                  install:
                                    items:
                                      description: ArgvCommand is a command executed
                                        directly, without a shell.
                                      properties:
                                        argv:
                                          items:
                                            type: string
                                          minItems: 1
                                          type: array
                                      required:
                                      - argv
                                      type: object
                                    minItems: 1
                                    type: array
                                required:
                                - install
                                type: object
                              providers:
                                description: Providers names the Provider credentials
                                  to inject.
                                items:
                                  type: string
                                type: array
                              reason:
                                type: string
                              run:
                                description: CommandRun is exactly one of argv (exec'd
                                  directly) or script (run with /bin/sh -c).
                                properties:
                                  argv:
                                    items:
                                      type: string
                                    minItems: 1
                                    type: array
                                  script:
                                    minLength: 1
                                    type: string
                                type: object
                                x-kubernetes-validations:
                                - message: exactly one of argv or script must be set
                                  rule: has(self.argv) != has(self.script)
                              timeout:
                                type: string
                            required:
                            - run
                            type: object
                          type: array
                      type: object
                    type: array
                  steps:
                    items:
                      description: 'Command is the unit of action: one sandboxed execution
                        (spec §8.1).'
                      properties:
                        egress:
                          description: Egress lists host:port or CIDR:port destinations
                            beyond what providers imply.
                          items:
                            type: string
                          type: array
                        files:
                          additionalProperties:
                            type: string
                          description: Files are written under /work before the command
                            runs, keyed by absolute path.
                          type: object
                        id:
                          type: string
                        image:
                          description: ImageSpec lists install commands baked into
                            the command's image at build time (spec §11.2).
                          properties:
                            install:
                              items:
                                description: ArgvCommand is a command executed directly,
                                  without a shell.
                                properties:
                                  argv:
                                    items:
                                      type: string
                                    minItems: 1
                                    type: array
                                required:
                                - argv
                                type: object
                              minItems: 1
                              type: array
                          required:
                          - install
                          type: object
                        providers:
                          description: Providers names the Provider credentials to
                            inject.
                          items:
                            type: string
                          type: array
                        reason:
                          type: string
                        run:
                          description: CommandRun is exactly one of argv (exec'd directly)
                            or script (run with /bin/sh -c).
                          properties:
                            argv:
                              items:
                                type: string
                              minItems: 1
                              type: array
                            script:
                              minLength: 1
                              type: string
                          type: object
                          x-kubernetes-validations:
                          - message: exactly one of argv or script must be set
                            rule: has(self.argv) != has(self.script)
                        timeout:
                          type: string
                      required:
                      - run
                      type: object
                    type: array
                  summary:
                    type: string
                  uncoveredSteps:
                    items:
                      type: string
                    type: array
                required:
                - hash
                - steps
                type: object
              planningSessionSeq:
                description: |-
                  PlanningSessionSeq is the audit sequence number of the current planning
                  session's first llm.request; conversation reload reads from there.
                format: int64
                type: integer
              questions:
                items:
                  description: Question is a clarifying question from the agent.
                  properties:
                    id:
                      type: string
                    options:
                      items:
                        type: string
                      type: array
                    text:
                      type: string
                  required:
                  - id
                  - text
                  type: object
                type: array
              remediationTimes:
                description: |-
                  RemediationTimes holds the start times, in RFC 3339, of the remediations
                  started in the last 24 hours, drift-started and retried alike; older ones
                  are dropped. With 6 in the window, the next remediation fails the Intent
                  with RemediationFailed instead of starting. A spec edit clears it; a
                  passing scheduled probe run does not. A drift that clears before
                  anything is remediated gives back the entry its start added.
                items:
                  type: string
                type: array
              remediations:
                description: |-
                  Remediations counts the consecutive remediations drift started. At 3,
                  the next drift fails the Intent with RemediationFailed instead of
                  planning. A scheduled probe run in which every probe passes, after the
                  Intent last became Ready, resets it to 0.
                format: int32
                type: integer
              replans:
                description: |-
                  Replans counts the consecutive replans a failed step started. At 3, the
                  next failed step fails the Intent with PlanningFailed instead of planning.
                  A spec edit, a retry and reaching Ready reset it to 0.
                format: int32
                type: integer
              retries:
                description: |-
                  Retries counts the retries of a Failed Intent, by the retry annotation or
                  automatically in an Auto stage; it sets the backoff before the next
                  automatic one (1m, doubled per retry, at most 1h). Reaching Ready and a
                  spec edit reset it to 0.
                format: int32
                type: integer
              stage:
                description: Stage identifies what an approval subject or allow rule
                  applies to.
                enum:
                - Discovery
                - Create
                - Update
                - Remediate
                - Delete
                type: string
              suggestedRules:
                items:
                  type: string
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
