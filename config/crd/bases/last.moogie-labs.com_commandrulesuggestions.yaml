---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: commandrulesuggestions.last.moogie-labs.com
spec:
  group: last.moogie-labs.com
  names:
    kind: CommandRuleSuggestion
    listKind: CommandRuleSuggestionList
    plural: commandrulesuggestions
    singular: commandrulesuggestion
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.trigger
      name: Trigger
      type: string
    - jsonPath: .spec.decision
      name: Decision
      type: string
    - jsonPath: .spec.proposed.match.argv
      name: Match
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: CommandRuleSuggestion is an allow rule the operator proposes;
          only humans decide it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CommandRuleSuggestionSpec is an operator-proposed allow rule
              awaiting a human decision.
            properties:
              breadthWarnings:
                items:
                  type: string
                maxItems: 20
                type: array
              decidedBy:
                minLength: 1
                type: string
              decision:
                default: Pending
                description: SuggestionDecision is a human's verdict on a suggestion.
                enum:
                - Pending
                - Accepted
                - Denied
                type: string
              decisionReason:
                type: string
              examples:
                items:
                  description: 'Command is the unit of action: one sandboxed execution
                    (spec §8.1).'
                  properties:
                    egress:
                      description: Egress lists host:port or CIDR:port destinations
                        beyond what providers imply.
                      items:
                        type: string
                      type: array
                    files:
                      additionalProperties:
                        type: string
                      description: Files are written under /work before the command
                        runs, keyed by absolute path.
                      type: object
                    id:
                      type: string
                    image:
                      description: ImageSpec lists install commands baked into the
                        command's image at build time (spec §11.2).
                      properties:
                        install:
                          items:
                            description: ArgvCommand is a command executed directly,
                              without a shell.
                            properties:
                              argv:
                                items:
                                  type: string
                                minItems: 1
                                type: array
                            required:
                            - argv
                            type: object
                          minItems: 1
                          type: array
                      required:
                      - install
                      type: object
                    providers:
                      description: Providers names the Provider credentials to inject.
                      items:
                        type: string
                      type: array
                    reason:
                      type: string
                    run:
                      description: CommandRun is exactly one of argv (exec'd directly)
                        or script (run with /bin/sh -c).
                      properties:
                        argv:
                          items:
                            type: string
                          minItems: 1
                          type: array
                        script:
                          minLength: 1
                          type: string
                      type: object
                      x-kubernetes-validations:
                      - message: exactly one of argv or script must be set
                        rule: has(self.argv) != has(self.script)
                    timeout:
                      type: string
                  required:
                  - run
                  type: object
                maxItems: 20
                type: array
              proposed:
                description: CommandRuleSpec lets matching commands skip approval
                  (spec §9).
                properties:
                  description:
                    type: string
                  egress:
                    description: A command's declared egress must be a subset of this
                      list.
                    items:
                      type: string
                    type: array
                  install:
                    description: Every image.install command of a matching command
                      must match one of these.
                    items:
                      description: |-
                        ArgvPattern matches a command's resolved argv position by position (spec §9.2):
                        a literal, a glob within one argument (*, ?, [...]), "re:<RE2>" anchored to one
                        argument, or "..." (last position only) for any remaining arguments.
                      properties:
                        argv:
                          items:
                            maxLength: 1024
                            type: string
                          maxItems: 64
                          minItems: 1
                          type: array
                      required:
                      - argv
                      type: object
                      x-kubernetes-validations:
                      - message: argv[0] must be a literal
                        rule: size(self.argv) == 0 || (!self.argv[0].contains('*')
                          && !self.argv[0].contains('?') && !self.argv[0].contains('[')
                          && !self.argv[0].startsWith('re:') && self.argv[0] != '...')
                      - message: '''...'' is only allowed in the last position'
                        rule: '!self.argv.exists(a, a == ''...'') || (self.argv[size(self.argv)
                          - 1] == ''...'' && size(self.argv.filter(a, a == ''...''))
                          == 1)'
                    maxItems: 32
                    type: array
                  match:
                    description: |-
                      ArgvPattern matches a command's resolved argv position by position (spec §9.2):
                      a literal, a glob within one argument (*, ?, [...]), "re:<RE2>" anchored to one
                      argument, or "..." (last position only) for any remaining arguments.
                    properties:
                      argv:
                        items:
                          maxLength: 1024
                          type: string
                        maxItems: 64
                        minItems: 1
                        type: array
                    required:
                    - argv
                    type: object
                    x-kubernetes-validations:
                    - message: argv[0] must be a literal
                      rule: size(self.argv) == 0 || (!self.argv[0].contains('*') &&
                        !self.argv[0].contains('?') && !self.argv[0].contains('[')
                        && !self.argv[0].startsWith('re:') && self.argv[0] != '...')
                    - message: '''...'' is only allowed in the last position'
                      rule: '!self.argv.exists(a, a == ''...'') || (self.argv[size(self.argv)
                        - 1] == ''...'' && size(self.argv.filter(a, a == ''...''))
                        == 1)'
                  providers:
                    description: A command's providers must be a subset of this list.
                    items:
                      type: string
                    minItems: 1
                    type: array
                  source:
                    description: RuleSource is provenance set by the CLI.
                    properties:
                      createdFrom:
                        description: RuleOrigin records how a rule was created.
                        enum:
                        - approval
                        - suggestion
                        - manual
                        type: string
                      suggestionRef:
                        description: LocalRef names an object in the same namespace
                          (or a cluster-scoped object).
                        properties:
                          name:
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - createdFrom
                    type: object
                  stages:
                    items:
                      description: Stage identifies what an approval subject or allow
                        rule applies to.
                      enum:
                      - Discovery
                      - Create
                      - Update
                      - Remediate
                      - Delete
                      type: string
                    minItems: 1
                    type: array
                required:
                - match
                - providers
                - stages
                type: object
              rationale:
                type: string
              targetScope:
                description: RuleScope is which kind of rule a suggestion would create.
                enum:
                - Namespace
                - Cluster
                type: string
              trigger:
                description: SuggestionTrigger is why the operator made a suggestion
                  (spec §9.5).
                enum:
                - PlanTime
                - RepeatedApproval
                - PeriodicReview
                type: string
            required:
            - proposed
            - targetScope
            - trigger
            type: object
            x-kubernetes-validations:
            - message: decision cannot change once decided
              rule: oldSelf.decision == 'Pending' || self.decision == oldSelf.decision
            - message: decidedBy is required once decided
              rule: self.decision == 'Pending' || has(self.decidedBy)
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
